name: Mirror to Codeberg and GitVerse (with link rewrite)

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

jobs:
  mirror-codeberg:
    name: Mirror to Codeberg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite GitHub links to Codeberg
        run: |
          FILES="store.json AGENTS.md"

          for f in $FILES; do
            if [ -f "$f" ]; then
              sed -i \
                -e 's#raw\.githubusercontent\.com/KangelPlugins/Plugins-Store/refs/heads/main/#codeberg.org/Kangel/Plugins-Store/raw/branch/main/#g' \
                -e 's#raw\.githubusercontent\.com/KangelPlugins/Plugins-Store/main/#codeberg.org/Kangel/Plugins-Store/raw/branch/main/#g' \
                -e 's#github\.com/KangelPlugins/Plugins-Store#codeberg.org/Kangel/Plugins-Store#g' \
                "$f"
            fi
          done

          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: rewrite GitHub links to Codeberg [mirror-bot]" || echo "Нечего коммитить"

      - name: Push to Codeberg
        env:
          CB_USER: ${{ secrets.CODEBERG_USER }}
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          CB_USER="$(printf '%s' "$CB_USER" | tr -d '\r\n' | xargs)"
          CB_TOKEN="$(printf '%s' "$CB_TOKEN" | tr -d '\r\n' | xargs)"

          git remote add mirror "https://${CB_USER}:${CB_TOKEN}@codeberg.org/Kangel/Plugins-Store.git"
          git push mirror HEAD:${{ github.ref_name }} --force
          git push mirror --tags --force

  mirror-gitverse:
    name: Mirror to GitVerse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite GitHub links to GitVerse
        run: |
          FILES="store.json AGENTS.md"

          for f in $FILES; do
            if [ -f "$f" ]; then
              sed -i \
                -e 's#raw\.githubusercontent\.com/KangelPlugins/Plugins-Store/refs/heads/main/#gitverse.ru/api/repos/bigfishtheory/Plugins-Store/raw/branch/main/#g' \
                -e 's#raw\.githubusercontent\.com/KangelPlugins/Plugins-Store/main/#gitverse.ru/api/repos/bigfishtheory/Plugins-Store/raw/branch/main/#g' \
                -e 's#github\.com/KangelPlugins/Plugins-Store#gitverse.ru/bigfishtheory/Plugins-Store#g' \
                "$f"
            fi
          done

          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: rewrite GitHub links to GitVerse [mirror-bot]" || echo "Нечего коммитить"

      - name: Push to GitVerse
        env:
          GV_USER: ${{ secrets.GITVERSE_USER }}
          GV_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          GV_USER="$(printf '%s' "$GV_USER" | tr -d '\r\n' | xargs)"
          GV_TOKEN="$(printf '%s' "$GV_TOKEN" | tr -d '\r\n' | xargs)"

          git remote add gitverse "https://${GV_USER}:${GV_TOKEN}@gitverse.ru/bigfishtheory/Plugins-Store.git"
          git push gitverse HEAD:${{ github.ref_name }} --force
          git push gitverse --tags --force
