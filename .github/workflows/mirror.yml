name: Mirror to Codeberg (with link rewrite)
 
on:
  push:
    branches: ['**']
    tags: ['**']
 
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Rewrite GitHub links to Codeberg
        run: |
          FILES="store.json AGENTS.md"
 
          for f in $FILES; do
            if [ -f "$f" ]; then
              sed -i \
                -e 's#raw\.githubusercontent\.com/KangelPlugins/Plugins-Store/refs/heads/main/#codeberg.org/Kangel/Plugins-Store/raw/branch/main/#g' \
                -e 's#raw\.githubusercontent\.com/KangelPlugins/Plugins-Store/main/#codeberg.org/Kangel/Plugins-Store/raw/branch/main/#g' \
                -e 's#github\.com/KangelPlugins/Plugins-Store#codeberg.org/Kangel/Plugins-Store#g' \
                "$f"
            fi
          done
 
          git config user.name "mirror-bot"
          git config user.email "mirror-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: rewrite GitHub links to Codeberg [mirror-bot]" || echo "Нечего коммитить"
 
      - name: Push to Codeberg
        env:
          CB_USER: ${{ secrets.CODEBERG_USER }}
          CB_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          # trim any accidental trailing newline/whitespace from the secrets
          CB_USER="$(printf '%s' "$CB_USER" | tr -d '\r\n' | xargs)"
          CB_TOKEN="$(printf '%s' "$CB_TOKEN" | tr -d '\r\n' | xargs)"
 
          git remote add mirror "https://${CB_USER}:${CB_TOKEN}@codeberg.org/Kangel/Plugins-Store.git"
          git push mirror HEAD:${{ github.ref_name }} --force
          git push mirror --tags --force
